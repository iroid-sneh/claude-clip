<!--
  Claude spark - EXACT frames from claude.gif, background removed, looping.
  Animation technique: an 8-frame horizontal sprite advanced with CSS steps(8).
  Loop = 1.6s (8 x 200ms) to match the original GIF exactly.
  Change --spark-size to resize, --spark-speed to retime. Nothing else needed.

  Two versions below:
   A) .spark        -> flat coral sprite (drop-in, keeps original colour)
   B) .spark-mask   -> white-silhouette sprite tinted via CSS, so you can recolour
                       the whole mark with one value (--spark-color).
-->
<style>
  :root{
    --spark-size: 104px;
    --spark-speed: 1.6s;
    --spark-color: #d97757;   /* only used by the mask version */
    --frames: 8;
  }
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(120% 100% at 50% 0%,#232220,#131210 70%);
    color:#f4f2ec;font-family:ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:48px 16px;
  }

  /* ---- the recording orb + spark (this is the timer state) ---- */
  .orb{
    position:relative;width:150px;height:150px;border-radius:50%;
    display:grid;place-items:center;
    background:radial-gradient(circle,#2c2a27 0%,#201f1c 62%,#1b1a17 100%);
    border:1px solid #38352f;
    box-shadow:0 0 0 0 rgba(217,119,87,.0);
    animation:halo 2.4s ease-in-out infinite;
  }
  @keyframes halo{
    0%,100%{box-shadow:0 0 26px 2px rgba(217,119,87,.20);}
    50%    {box-shadow:0 0 40px 6px rgba(217,119,87,.42);}
  }

  .spark, .spark-mask{
    width:var(--spark-size);height:var(--spark-size);
  }

<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
  <div class="orb">
    <span class="spark"></span>
    <span class="rec-dot"></span>
  </div>
  <div class="timer" id="t">00:00</div>
  <div class="label">Recording</div>
  <div class="cap">flat coral sprite &middot; exact GIF frames &middot; 1.6s loop</div>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
  <div class="orb"><span class="spark-mask"></span><span class="rec-dot"></span></div>
  <div class="cap">recolourable mask version &middot; set --spark-color</div>
</div>

<script>
  let s=0,el=document.getElementById('t');
  const f=n=>String(n).padStart(2,'0');
  setInterval(()=>{s++;el.textContent=f(Math.floor(s/60))+':'+f(s%60);},1000);
</script>
